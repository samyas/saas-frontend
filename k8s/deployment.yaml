# =============================================================================
# Deployment for SaaS Frontend
# Next.js application running in standalone mode
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-frontend
  namespace: saas-frontend
  labels:
    app: saas-frontend
    app.kubernetes.io/name: saas-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: saas-frontend
  template:
    metadata:
      labels:
        app: saas-frontend
        app.kubernetes.io/name: saas-frontend
      annotations:
        # Force rolling restart when configmap changes
        checksum/config: "{{ include (print $.Template.BasePath \"/configmap.yaml\") . | sha256sum }}"
    spec:
      # Use non-root user for security
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        
      containers:
        - name: saas-frontend
          image: ghcr.io/samyas/saas-frontend:latest
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          
          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: saas-frontend-config
          
          # Resource limits
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          
          # Health checks
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          # Security context for container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      
      # Pull from GHCR (public repo - no secret needed)
      # For private repos, uncomment and create imagePullSecrets
      # imagePullSecrets:
      #   - name: ghcr-secret
      
      # Spread pods across nodes (when multi-node)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: saas-frontend
